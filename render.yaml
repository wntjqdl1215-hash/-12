# Render.com 무료 배포 설정. github 저장소 연결 후 자동 인식된다.
services:
  - type: web
    name: stock-news-glance
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --chdir backend app:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 60
    envVars:
      - key: CACHE_TTL
        value: "300"
      - key: REFRESH_INTERVAL
        value: "300"
      # 선택: 초보자 AI 요약을 쓰려면 대시보드에서 ANTHROPIC_API_KEY 추가
      # 선택: 네이버 블로그 소스를 쓰려면 NAVER_CLIENT_ID / NAVER_CLIENT_SECRET 추가
