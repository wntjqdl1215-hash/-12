<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>주식 뉴스 한눈에</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <h1>📈 주식 뉴스 한눈에</h1>
    <p class="tagline">관심 종목 뉴스를 한 화면에. 어려운 건 쉽게 풀어드려요. <b>판단은 직접 하세요.</b></p>
  </header>

  <section class="search">
    <input id="symbols" type="text"
           placeholder="예: 삼성전자, SK하이닉스, 000660" />
    <button id="loadBtn">불러오기</button>
  </section>

  <div class="chips" id="quickChips">
    <span class="quick" data-v="삼성전자">삼성전자</span>
    <span class="quick" data-v="SK하이닉스">SK하이닉스</span>
    <span class="quick" data-v="카카오">카카오</span>
    <span class="quick" data-v="NAVER">NAVER</span>
    <span class="quick" data-v="에코프로비엠">에코프로비엠</span>
  </div>

  <section id="briefing" class="briefing" hidden></section>

  <div class="statusbar">
    <span id="updated"></span>
    <label class="auto"><input type="checkbox" id="autoRefresh" checked /> 자동 새로고침(5분)</label>
  </div>

  <main id="results"></main>

  <footer>
    <p>※ 본 서비스는 정보 제공 목적이며 투자 권유가 아닙니다. 투자 판단과 책임은 본인에게 있습니다.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
